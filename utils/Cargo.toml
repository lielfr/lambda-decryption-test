[package]
name = "utils"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
aws-config = { version = "1.8.16", features = ["behavior-version-latest"] }
aws-lc-rs = "1.16.3"
aws-sdk-cloudwatchlogs = "1.131.0"
aws-sdk-s3 = "1.132.0"
aws-smithy-types-convert = { version = "0.60.14", features = ["convert-chrono"] }
base64 = "0.22.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tabled = { version = "0.16.0", features = ["ansi"] }
tokio = { version = "1.52.2", features = ["full"] }

[[bin]]
name = "generate_upload_data"

[[bin]]
name = "get_statistics_per_function"
